name: Build NX30 Pro NMBM

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load verified NX30 Pro config
        run: |  
          cp configs/nx30pro-nmbm.config .config
          make defconfig

      - name: Validate selected config
        run: |
          grep -qx 'CONFIG_TARGET_mediatek=y' .config
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm=y' .config
          grep -qx 'CONFIG_TARGET_PROFILE="DEVICE_h3c_magic-nx30-pro-nmbm"' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-turboacc-mtk=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-bonding=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-netlink-diag=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-ipt-fullconenat=y' .config          

      - name: Show selected config
        run: |
          echo "==== target/profile ===="
          grep -E '^(CONFIG_TARGET_|CONFIG_TARGET_PROFILE)' .config | sort || true
          echo "==== required GUI packages ===="
          grep -E '^(CONFIG_PACKAGE_luci-app-mtwifi-cfg|CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn|CONFIG_PACKAGE_luci-app-turboacc-mtk|CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn|CONFIG_PACKAGE_kmod-bonding|CONFIG_PACKAGE_kmod-netlink-diag|CONFIG_PACKAGE_kmod-ipt-fullconenat)' .config || true

      - name: Download sources
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Show generated images
        if: always()
        run: |
          echo "==== filogic outputs ===="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f | sort || true
          echo "==== NX30 outputs ===="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f | grep -Ei 'nx30|h3c' || true

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx30pro-output
          path: |
            bin/targets/mediatek/filogic/
            .config
            build.log
          if-no-files-found: warn
